name: Build & Deploy lên Hostinger

# Mỗi lần push lên nhánh main: tự build và đẩy thư mục out/ lên Hostinger qua FTP.
#
# CẦN CÀI 3 SECRET TRONG GITHUB TRƯỚC KHI DÙNG
#   Settings > Secrets and variables > Actions > New repository secret
#     FTP_SERVER    ví dụ: ftp.tenmiencuaban.com   (hPanel > Files > FTP Accounts)
#     FTP_USERNAME  ví dụ: u123456789.tenmien
#     FTP_PASSWORD  mật khẩu tài khoản FTP đó
#
# Chưa cài secret thì workflow sẽ dừng ở bước deploy và báo lỗi — build vẫn chạy.

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu
        run: npm run typecheck

      - name: Build trang tĩnh
        run: npm run build

      - name: Đẩy lên Hostinger qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Dấu / ở cuối là bắt buộc
          local-dir: ./out/
          server-dir: ./public_html/
          # Chỉ upload file đã thay đổi -> deploy sau lần đầu chỉ mất vài giây
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
