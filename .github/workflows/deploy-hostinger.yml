name: Build & Deploy lên Hostinger

# ĐANG TẮT TỰ CHẠY — CỐ Ý. Đọc hết phần này trước khi bật lại.
#
# Hostinger TỰ kéo code từ GitHub về và deploy, không cần workflow này. Đã
# kiểm chứng: workflow này chưa từng chạy được lần nào (thiếu secret FTP) mà
# hàng mới vẫn lên web bình thường, kể cả trang "đã bán" mới làm.
#
# Để nó chạy theo mỗi lần push chỉ được hai thứ: một mail báo lỗi mỗi lần, và
# nguy cơ hai cơ chế cùng ghi vào public_html một lúc.
#
# Vẫn giữ file để dành: hôm nào Hostinger đổi cách deploy hoặc cần đẩy tay thì
# có sẵn. Chạy tay được ở tab Actions > Run workflow.
#
# MUỐN BẬT LẠI TỰ ĐỘNG:
#   1. Cài 3 secret ở Settings > Secrets and variables > Actions
#        FTP_SERVER    ví dụ: ftp.tenmiencuaban.com   (hPanel > Files > FTP Accounts)
#        FTP_USERNAME  ví dụ: u123456789.tenmien
#        FTP_PASSWORD  mật khẩu tài khoản FTP đó
#      Thiếu secret thì hỏng đúng ở bước cuối: "Input required and not supplied: server"
#   2. Bỏ dấu # ở hai dòng `push:` và `branches:` bên dưới
#   3. TẮT deploy tự động của Hostinger trong hPanel, tránh hai bên giẫm chân nhau

on:
  # push:
  #   branches: [main]
  workflow_dispatch: # bấm chạy tay trong tab Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu
        run: npm run typecheck

      - name: Build trang tĩnh
        run: npm run build

      - name: Đẩy lên Hostinger qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Dấu / ở cuối là bắt buộc
          local-dir: ./out/
          server-dir: ./public_html/
          # Chỉ upload file đã thay đổi -> deploy sau lần đầu chỉ mất vài giây
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
